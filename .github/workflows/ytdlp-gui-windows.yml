name: Build Windows EXE (yt-dlp GUI)

on:
  push:
    paths:
      - "yt-dlp-gui/**"
      - ".github/workflows/ytdlp-gui-windows.yml"
    tags:
      - "ytdlp-gui-v*"
  pull_request:
    paths:
      - "yt-dlp-gui/**"
      - ".github/workflows/ytdlp-gui-windows.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: yt-dlp-gui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install -U pip
          python -m pip install -U pyinstaller -r requirements.txt

      - name: Download ffmpeg
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_tmp
          $bin = Get-ChildItem ffmpeg_tmp -Recurse -Directory -Filter bin | Select-Object -First 1
          Copy-Item "$($bin.FullName)\ffmpeg.exe", "$($bin.FullName)\ffprobe.exe" .

      - name: Build exe
        run: >
          pyinstaller --noconfirm --clean --onefile --noconsole
          --name UltimateVideoDownloader --icon icon.ico
          --collect-submodules yt_dlp
          --add-binary "ffmpeg.exe;." --add-binary "ffprobe.exe;."
          ytdlp_gui.py

      - name: Smoke test exe
        run: |
          $p = Start-Process dist\UltimateVideoDownloader.exe -ArgumentList "--selftest" -Wait -PassThru
          if ($p.ExitCode -ne 0) { throw "selftest failed with exit code $($p.ExitCode)" }
          Get-Item dist\UltimateVideoDownloader.exe | Format-List Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: UltimateVideoDownloader-windows
          path: yt-dlp-gui/dist/UltimateVideoDownloader.exe

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: yt-dlp-gui/dist/UltimateVideoDownloader.exe
